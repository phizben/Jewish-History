<title>אטלס העם היהודי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: three fixed zones, no floating cards. Top bar (where am I in time), a side panel (what is happening now, and details), the map (where), and the timeline at the bottom (how to move). */
:root{
  color-scheme:dark;
  --bg:#0A0F1A; --paper:#0E1626; --paper-2:#121C30; --ink:#EAF0F8; --ink-2:#AEBBD0; --muted:#6B7A94; --hair:#1E2A42;
  --brand:#6FA8D6; --brand-ink:#0A0F1A; --brand-soft:#16263E;
  --gold:#E7B24C; --gold-ink:#FFD98C; --gold-soft:#241B0C;
  --ally:#3FD19B; --enemy:#F26B6B; --mixed:#B38BF0; --neutral:#AEB8C6;
  --sea:#070C16; --land:#17223A; --border:#33507A; --label:#5E7CA6; --grid:#13203A;
  --e-ancient:#E7C887; --e-classical:#9DB8E8; --e-exile:#C3A7E6; --e-medieval:#9ED3B0; --e-early-modern:#F1B67E; --e-modern:#8CCFE0; --e-holocaust:#A3A0A9; --e-israel:#9EBCF3;
  --f-display:"Rubik","Segoe UI",system-ui,sans-serif;
  --f-ui:"Rubik","Segoe UI",Arial,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,monospace;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

/* ---------- top bar ---------- */
.top{background:var(--paper);border-bottom:1px solid var(--hair);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{display:flex;align-items:baseline;gap:12px;justify-content:center}
.now .y{font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.now .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.now .meta b{color:var(--gold-ink);font-weight:600}
.acts{display:flex;gap:4px;justify-content:flex-end}
.ibtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink-2)}
.ibtn:hover{background:var(--paper-2);color:var(--ink)}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0}

/* panel */
.panel{background:var(--paper);border-inline-end:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;position:relative;z-index:3}
.chap{padding:16px 18px 14px;border-bottom:1px solid var(--hair);position:relative}
.chap .ribbon{position:absolute;inset:0 0 auto 0;height:4px}
.chap .row{display:flex;align-items:center;gap:4px}
.chap .no{flex:1;font-size:12.5px;color:var(--muted);font-weight:500}
.chap .no b{color:var(--ink);font-weight:600}
.nbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.nbtn:hover:not(:disabled){background:var(--paper-2);color:var(--ink)}
.nbtn:disabled{opacity:.3;cursor:default}
.nbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chap h2{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.chap .yrs{font-size:13px;color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.chap p{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chap[data-more="true"] p{-webkit-line-clamp:unset;display:block}
.chap .more{margin-top:4px;color:var(--brand);font-weight:600;font-size:13px;padding:2px 0}
.ctx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ctx span{font-size:12px;color:var(--ink-2);background:var(--paper-2);border-radius:999px;padding:3px 10px}
.ctx span b{font-weight:600;color:var(--ink)}

.list{flex:1;overflow:auto;min-height:0;padding:6px 0 16px}
.list h3{margin:12px 18px 4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.grp{padding:2px 8px}
.ghead{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;text-align:start}
.ghead:hover{background:var(--paper-2)}
.ghead .dot{width:10px;height:10px;border-radius:50%;flex:none}
.ghead .t{flex:1;font-weight:600;font-size:14px}
.ghead .c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead .eye{width:18px;height:18px;color:var(--muted)}
.ghead .eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grp[data-off="true"] .ghead .t,.grp[data-off="true"] .ghead .dot{opacity:.4}
.grp[data-off="true"] ul{display:none}
.grp ul{list-style:none;margin:0 0 4px;padding:0}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px 7px 28px;border-radius:10px;text-align:start}
[dir="rtl"] .item{padding:7px 28px 7px 10px}
.item:hover,.item.hl{background:var(--brand-soft)}
.item span{flex:1;min-width:0;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.major span{font-weight:600}
.showall{margin:0 10px 4px 28px;font-size:12.5px;color:var(--brand);font-weight:600;padding:4px 10px}
[dir="rtl"] .showall{margin:0 28px 4px 10px}
.empty{margin:4px 38px 8px;font-size:13px;color:var(--muted)}

/* detail view (inside panel) */
.detail{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;min-height:0;z-index:2}
.detail .bar{display:flex;align-items:center;gap:6px;padding:10px 10px;border-bottom:1px solid var(--hair)}
.detail .back{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--brand)}
.detail .back:hover{background:var(--brand-soft)}
.detail .back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.detail .scroll{overflow:auto;min-height:0;padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
.detail .kind{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.detail .kind i{width:10px;height:10px;border-radius:50%}
.detail h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--paper-2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.detail p{margin:0;font-size:15px;line-height:1.65}
.cal{display:flex;gap:10px;background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.cal svg{width:20px;height:20px;flex:none;stroke:var(--gold-ink);fill:none;stroke-width:2;margin-top:1px}
.cal b{display:block;font-size:12px;color:var(--gold-ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.detail h3{margin:4px 0 0;font-size:12px;font-weight:600;color:var(--muted)}
.works{margin:0;padding-inline-start:18px;font-size:14px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;background:var(--paper-2)}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.spark path{fill:var(--gold-soft);stroke:var(--gold);stroke-width:2}
.spark text{font-size:11px;fill:var(--muted);font-family:var(--f-ui)}

/* map */
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--sea)}
#map{direction:ltr;position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.sphere{fill:var(--sea)}
.landbase{fill:var(--land)}
.poly{fill:transparent;stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.poly.pn{stroke-opacity:.35}
.ovl{fill:var(--brand);fill-opacity:.18;stroke:var(--brand);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:5 4}
.ovl.inf{fill-opacity:.06;stroke-width:1.5;stroke-dasharray:2 4}
.plabel{fill:var(--label);font-family:var(--f-ui);font-weight:500;text-anchor:middle;pointer-events:none}
.olabel{fill:var(--brand);font-family:var(--f-display);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.olabel.inf{font-family:var(--f-ui);font-weight:600;opacity:.85}
.mk{cursor:pointer}
.mk .m{stroke:var(--paper);stroke-width:1.8}
.mk.comm .m{fill:var(--gold);fill-opacity:.85;stroke-width:1.2}
.mk.person .m{fill:var(--brand)}
.mk.ally .m{fill:var(--ally)}.mk.enemy .m{fill:var(--enemy)}.mk.mixed .m{fill:var(--mixed)}
.mk.event .m{fill:var(--paper);stroke-width:2.6}
.mk.event.t-bad .m{stroke:var(--enemy)}.mk.event.t-good .m{stroke:var(--ally)}.mk.event.t-neutral .m{stroke:var(--neutral)}
.mk .pill{display:none}
.mk.lab .pill,.mk.hl .pill,.mk.sel .pill{display:inline}
.mk.minor .m{opacity:.5}
.mk.minor.hl .m,.mk.minor.sel .m{opacity:1}
.mk .pill rect{fill:var(--paper);stroke:var(--hair)}
.mk .pill text{fill:var(--ink);font-family:var(--f-ui);font-size:12px;font-weight:600;dominant-baseline:central;pointer-events:none}
.mk.hl .m,.mk.sel .m{stroke:var(--ink);stroke-width:2.6}
.mk .ring{fill:none;stroke:var(--gold);stroke-width:3;display:none}
.mk.sel .ring,.mk.hl .ring{display:inline}
.zoomctl{position:absolute;bottom:14px;inset-inline-end:14px;display:flex;flex-direction:column;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:2}
.zoomctl button{width:40px;height:40px;display:grid;place-items:center;color:var(--ink-2)}
.zoomctl button+button{border-top:1px solid var(--hair)}
.zoomctl button:hover{background:var(--paper-2);color:var(--ink)}
.zoomctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---------- timeline ---------- */
.dock{background:var(--paper);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.dbar{display:flex;align-items:center;gap:10px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.play{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px;fill:currentColor}
[dir="rtl"] .play .tri{transform:scaleX(-1);transform-origin:center}
.fullbtn{display:inline-flex;align-items:center;gap:6px;height:34px;border-radius:999px;background:var(--paper-2);padding:0 13px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.fullbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.fullbtn:hover{color:var(--ink)}
.fullbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.heatbtn{display:inline-flex;align-items:center;gap:6px;height:34px;border-radius:999px;background:var(--paper-2);padding:0 13px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none}
.heatbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.heatbtn:hover{color:var(--ink)}
.heatbtn[aria-pressed="true"]{color:var(--gold-ink);background:var(--gold-soft)}
.heatbtn[aria-pressed="true"] svg{filter:drop-shadow(0 0 4px rgba(231,178,76,.6))}
@media (max-width:640px){.heatbtn span{display:none}.heatbtn{padding:0;width:36px;justify-content:center}}
.layerswrap{position:relative;flex:none}
.layersmenu{position:absolute;bottom:calc(100% + 8px);inset-inline-start:0;background:var(--paper);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:30;display:flex;flex-direction:column;gap:2px}
.layersmenu button{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:transparent;border:0;color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:start}
.layersmenu button:hover{background:var(--paper-2)}
.layersmenu .dot{width:10px;height:10px;border-radius:50%;flex:none}
.layersmenu .sw{margin-inline-start:auto;width:34px;height:20px;border-radius:999px;background:var(--hair);position:relative;transition:background .15s;flex:none}
.layersmenu .sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.layersmenu button[aria-pressed="true"] .sw{background:var(--gold)}
.layersmenu button[aria-pressed="true"] .sw::after{inset-inline-start:16px}
.heatlayer circle{pointer-events:none;mix-blend-mode:screen}
.heatlabel{fill:var(--gold-ink);font-weight:600;paint-order:stroke;stroke:rgba(4,7,13,.82);stroke-linejoin:round;text-anchor:middle;letter-spacing:.2px;opacity:.92;pointer-events:none}
.edgechip{cursor:pointer}
.edgechip .pill{fill:rgba(16,22,34,.92);stroke:var(--gold);stroke-width:1.1}
.edgechip text{fill:var(--gold-ink);font:600 13px Heebo,sans-serif;dominant-baseline:middle;text-anchor:middle;pointer-events:none}
.edgechip .arw{fill:var(--gold)}
.edgechip:hover .pill{fill:var(--gold-soft);stroke:var(--gold-ink)}
.legend i.heat{background:transparent!important;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px var(--gold) inset, 0 0 7px 1px rgba(231,178,76,.75);background:radial-gradient(circle,rgba(231,178,76,.9),rgba(231,178,76,0) 70%)!important}
#app.full #main{display:none}
#app.full{grid-template-rows:auto minmax(0,1fr)}
#app.full .dock{display:flex;flex-direction:column;min-height:0}
#app.full .tlwrap{flex:1;height:auto;min-height:0}
#app.full .tlscroll{overflow-y:auto}
#app.full .legend{display:none}
.tzoom{display:inline-flex;align-items:center;gap:2px}
.tzoom button{height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);font-size:13px;font-weight:600}
.tzoom .zb{width:32px}
.tzoom .zb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.tzoom .zall{padding:0 10px}
.tzoom button:hover:not(:disabled){background:var(--paper-2);color:var(--ink)}
.tzoom button:disabled{opacity:.3;cursor:default}
.tzspan{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dbar .grow{flex:1}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend i.ring{background:transparent;border:2.4px solid var(--neutral);width:10px;height:10px;box-sizing:border-box}
.tlwrap{position:relative;height:184px}
.tlscroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;cursor:grab;scrollbar-width:none;outline:none;overscroll-behavior:contain}
.tlscroll::-webkit-scrollbar{display:none}
.tlscroll.drag{cursor:grabbing;user-select:none}
.tlscroll.fit{touch-action:none}
.tlscroll:focus-visible{box-shadow:inset 0 0 0 3px var(--brand)}
#tl{display:block}
#tl text{font-family:var(--f-ui)}
.tl-era rect{rx:7}
.tl-era text{font-size:12.5px;font-weight:600;fill:#1E232D;pointer-events:none}
.tl-era{cursor:pointer}
.tl-era:hover rect{filter:brightness(1.05)}
.tl-era.cur rect{stroke:var(--ink);stroke-width:2}
.tick{font-size:11.5px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.grid line{stroke:var(--hair)}
.rowlab{font-size:10.5px;font-weight:600;fill:var(--muted)}
.bead{cursor:pointer}
.bead .m{stroke:var(--paper);stroke-width:1.6}
.bead.event .m{fill:var(--paper);stroke-width:2.4}
.bead.t-bad .m{stroke:var(--enemy)}.bead.t-good .m{stroke:var(--ally)}.bead.t-neutral .m{stroke:var(--neutral)}
.bead.person .m{fill:var(--brand)}.bead.ally .m{fill:var(--ally)}.bead.enemy .m{fill:var(--enemy)}.bead.mixed .m{fill:var(--mixed)}
.bead:hover .m,.bead.sel .m,.bead.hl .m{stroke:var(--ink);stroke-width:2.6}
.blab{font-size:12px;font-weight:500;fill:var(--ink-2);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.blab.major{font-weight:600;fill:var(--ink)}
.rowtags{position:absolute;top:0;inset-inline-start:0;height:0;z-index:3;pointer-events:none}
.rowtags div{position:absolute;inset-inline-start:4px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:color-mix(in srgb,var(--paper) 86%,transparent);padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.45}
.playhead{position:absolute;top:0;bottom:0;width:0;pointer-events:none;z-index:4}
.playhead::after{content:"";position:absolute;top:22px;bottom:0;left:-1px;width:2px;background:var(--gold)}
.playhead .knob{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2B1C02;font-weight:700;font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(15,18,26,.45);z-index:40;display:grid;place-items:center;padding:16px}
.sheet{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);width:min(920px,100%);max-height:88%;overflow:auto;padding:20px 22px}
.sheet .sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;flex:1}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ch{border-radius:12px;background:var(--paper-2);padding:10px 12px 14px;text-align:start;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.ch .no{font-size:12px;color:var(--muted)}
.ch b{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.2}
.ch small{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ch .strip{position:absolute;inset:auto 0 0 0;height:4px}
.ch:hover{background:var(--brand-soft)}
.ch[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--brand)}
.palette{width:min(560px,100%);padding:0;overflow:hidden;align-self:start;margin-top:10vh}
.palette .qbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--hair)}
.palette .qbar svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.palette .qbar kbd{flex:none}
.palette input{flex:1;min-width:0;border:0;background:transparent;padding:2px 0;font:inherit;font-size:17px;color:var(--ink);outline:none}
.palette .qhint{padding:10px 18px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.palette ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.palette li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer}
.palette li[aria-selected="true"],.palette li:hover{background:var(--brand-soft)}
.palette li i{width:10px;height:10px;border-radius:50%;flex:none}

/* ===================== CONSOLE SKIN ===================== */
body{background:radial-gradient(1100px 650px at 72% -8%,rgba(111,168,214,.08),transparent 60%),radial-gradient(900px 620px at 6% 112%,rgba(231,178,76,.06),transparent 55%),var(--bg)}

.top{background:linear-gradient(180deg,rgba(18,28,48,.92),rgba(10,15,26,.55))}
.dock{background:linear-gradient(0deg,var(--paper),rgba(10,15,26,.5))}
.panel{background:linear-gradient(180deg,var(--paper),rgba(10,15,26,.35))}
/* mono numerics + glowing year */
.now .y{font-family:var(--f-mono);color:var(--gold);text-shadow:0 0 12px rgba(231,178,76,.5);letter-spacing:1px}
.now .meta{font-family:var(--f-mono);font-size:12px}

.yrs,.tick,.ghead .c,.item small,.tag,.chap .no,.rowlab,.blab{font-family:var(--f-mono)}
.knob{font-family:var(--f-mono);box-shadow:0 0 12px rgba(231,178,76,.5)}
.playhead::after{box-shadow:0 0 10px rgba(231,178,76,.6)}
/* brand mark glow */
.brand svg{filter:drop-shadow(0 0 6px rgba(231,178,76,.4))}
/* HUD corner ticks on the year readout */
.now{position:relative;padding:4px 16px;border:1px solid var(--hair);border-radius:10px;background:rgba(7,12,22,.5)}
.now::before,.now::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--gold);opacity:.55}
.now::before{top:-1px;inset-inline-start:-1px;border-inline-end:0;border-bottom:0}
.now::after{bottom:-1px;inset-inline-end:-1px;border-inline-start:0;border-top:0}
/* map: tactical display */
.mapwrap{background:radial-gradient(130% 100% at 50% 0%,rgba(111,168,214,.06),transparent 60%),var(--sea)}
.landbase{fill:var(--land);stroke:var(--border);stroke-width:.7;filter:drop-shadow(0 0 5px rgba(51,80,122,.35))}
.poly{stroke:var(--border);stroke-opacity:.5}

/* marker + bead glow */
.mk .m,.bead .m{filter:url(#glow)}

.ic,.ibtn{background:var(--paper-2);border:1px solid var(--hair)}

/* search palette on dark */
.palette .qbar svg{stroke:var(--gold)}
kbd{background:var(--panel-2,#121C30)}

.overlay .sheet{animation:sheet-in .3s cubic-bezier(.2,.8,.3,1) both}
/* tactile buttons */
.ibtn,.gamebtn,.c-prev,.c-next,.c-all,.zoomctl button,.tz button{transition:transform .12s ease,filter .12s ease,background .15s ease,border-color .15s ease}
.ibtn:active,.gamebtn:active,.zoomctl button:active,.tz button:active{transform:scale(.92)}
.btn,.g-btn,.g-opt,.g-card,.g-ocard,.g-mode,.g-next,.intro-go,.ch{transition:transform .12s ease,filter .14s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease}
.btn:active,.g-btn:active,.g-next:active,.intro-go:active{transform:scale(.98)}
/* map marker selection pulse + smooth hover */
.mk .m,.bead{transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.mk.sel .m{animation:mk-pulse 1.8s ease-in-out infinite}
@keyframes mk-pulse{0%,100%{filter:drop-shadow(0 0 2px rgba(231,178,76,.5))}50%{filter:drop-shadow(0 0 7px rgba(231,178,76,.9))}}
/* detail panel content fade on change */
.detail{transition:opacity .2s ease}
/* ===== onboarding modal ===== */
.introbox{width:min(560px,100%);align-self:start;margin-top:7vh;max-height:88vh;overflow:auto;padding:30px 26px 26px;text-align:center}
.intro-hero{display:flex;flex-direction:column;align-items:center;gap:10px}
.intro-logo{width:60px;height:60px;filter:drop-shadow(0 0 18px rgba(76,127,224,.55))}
.introbox h2{font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--ink);margin:6px 0 0;line-height:1.15;text-align:center;flex:none}
.intro-hero p{margin:0;color:var(--muted);font-size:15px;max-width:40ch}
.intro-steps{display:flex;flex-direction:column;gap:12px;margin:24px 0}
.intro-step{display:flex;align-items:center;gap:14px;text-align:start;padding:14px 16px;border-radius:16px;background:var(--paper-2);border:1px solid var(--hair)}
.intro-ic{font-size:26px;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--brand) 14%,transparent)}
.intro-tx b{display:block;font-size:16px;color:var(--ink)}
.intro-tx span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.intro-go{width:100%;padding:15px;border-radius:14px;background:var(--gold);color:#2B1C02;border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 0 20px rgba(231,178,76,.3)}
.intro-go:hover{filter:brightness(1.06)}
@media (prefers-reduced-motion:reduce){.overlay:not([hidden]),.overlay .sheet,.mk.sel .m{animation:none}}
</style>

    <div class="now" aria-live="polite"><span class="y" id="yr"></span><span class="meta"><span id="yrsub"></span><span class="pop" id="pop"></span></span></div>

  <section class="dock">
    <div class="dbar">
      <button class="play" id="play"><svg viewBox="0 0 24 24"><path class="tri" id="playicon" d="M8 5v14l11-7z"/></svg></button>
      <div class="tzoom" role="group"><button id="tz-out" class="zb"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><button id="tz-all" class="zall"></button><button id="tz-in" class="zb"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button></div>
      <button class="fullbtn" id="fullbtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span></span></button>

        <div class="layersmenu" id="layersmenu" hidden></div>
