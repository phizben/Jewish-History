<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Frank+Ruhl+Libre:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0A0F1A;font-family:'Heebo',system-ui,sans-serif;color:#EAF0FB;position:relative}
/* glows */
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.g1{width:520px;height:520px;background:#4C7FE0;left:-120px;top:-160px;opacity:.28}
.g2{width:460px;height:460px;background:#E7B24C;right:-120px;bottom:-180px;opacity:.22}
/* graticule */
svg.grid{position:absolute;inset:0;width:100%;height:100%;opacity:.14}
/* center-of-gravity dots */
.dot{position:absolute;border-radius:50%;box-shadow:0 0 0 6px rgba(231,178,76,.08)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 86px;z-index:3}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:30px}
.logo svg{width:66px;height:66px;filter:drop-shadow(0 0 16px rgba(76,127,224,.5))}
.logo .en{font-family:'Share Tech Mono',monospace;font-size:21px;letter-spacing:.14em;color:#8FB0EE;text-transform:uppercase}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:96px;line-height:1.02;letter-spacing:-.01em}
h1 .gold{color:#E7B24C}
.sub{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:40px;color:#C7D4EC;margin-top:14px}
.tag{font-size:30px;color:#9FB0C9;margin-top:26px;font-weight:400}
.foot{position:absolute;bottom:40px;right:86px;left:86px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.era{display:flex;gap:10px}
.era span{font-family:'Share Tech Mono',monospace;font-size:17px;color:#64748B}
.era b{color:#E7B24C}
.url{font-family:'Share Tech Mono',monospace;font-size:18px;color:#5B6b82;letter-spacing:.04em}
</style></head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<svg class="grid" viewBox="0 0 1200 630" preserveAspectRatio="none">
 <g stroke="#4C7FE0" stroke-width="1" fill="none">
  <path d="M0 90H1200M0 200H1200M0 315H1200M0 430H1200M0 540H1200"/>
  <path d="M120 0V630M310 0V630M500 0V630M690 0V630M880 0V630M1070 0V630"/>
 </g>
 <g stroke="#4C7FE0" stroke-width="1.4" fill="none" opacity=".7">
  <ellipse cx="600" cy="315" rx="560" ry="300"/><ellipse cx="600" cy="315" rx="380" ry="300"/><ellipse cx="600" cy="315" rx="190" ry="300"/>
 </g>
</svg>
<!-- center-of-gravity glow dots -->
<div class="dot" style="width:22px;height:22px;background:#E7B24C;left:150px;top:210px;opacity:.9"></div>
<div class="dot" style="width:15px;height:15px;background:#4C7FE0;left:250px;top:150px;opacity:.8"></div>
<div class="dot" style="width:13px;height:13px;background:#E7B24C;left:200px;top:300px;opacity:.7"></div>
<div class="dot" style="width:12px;height:12px;background:#4C7FE0;left:1010px;top:470px;opacity:.7"></div>
<div class="dot" style="width:17px;height:17px;background:#E7B24C;left:950px;top:400px;opacity:.75"></div>

<div class="wrap">
 <div class="logo">
  <svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#4C7FE0"/><path d="M17 6l9.5 16.5H7.5z M17 28L7.5 11.5h19z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
  <div class="en">Atlas of the Jewish People</div>
 </div>
 <h1>אטלס <span class="gold">העם היהודי</span></h1>
 <div class="sub">מסע דרך הדורות — על מפה וציר זמן</div>
 <div class="tag">ידידים וצוררים · דמויות · אירועים · מרכזי החיים — ומשחקים ללמידה</div>
</div>
<div class="foot">
 <div class="era"><span>1800 <b>לפנה״ס</b></span><span>·</span><span>2026</span></div>
 <div class="url">jewish-history-five.vercel.app</div>
</div>
</body></html>
